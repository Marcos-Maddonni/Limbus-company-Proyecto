<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Archivo del Sinner de Limbus Company.">
    <title>Limbus Company | Sinner</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="character-page" data-character="meursault">
    <header class="site-header">
        <div class="header-inner">
            <p class="eyebrow">LIMBUS COMPANY</p>
            <h1>SINNERS</h1>
            <p class="subtitle">Archivo de personajes</p>
        </div>
    </header>

    <main class="container">
        <section class="character-hero">
            <div class="character-portrait">
                <img id="character-image" src="../Assets/IMG/Mersault.webp" alt="Sinner">
            </div>

            <div class="character-intro">
                <p class="eyebrow">ARCHIVO DEL SINNER</p>
                <h2 id="character-name">Cargando...</h2>
                <p class="character-subtitle" id="character-title"></p>
                <div class="character-facts" id="character-facts"></div>
            </div>
        </section>

        <section class="content-section character-content">
            <div class="section-title">
                <h2>Información</h2>
            </div>
            <div class="text-card">
                <p id="character-description">Cargando información...</p>
            </div>
        </section>

        <section class="content-section">
            <div class="section-title">
                <h2>Perfil</h2>
            </div>

            <div class="character-content-grid">
                <article class="character-info-card">
                    <h3>Personalidad</h3>
                    <p id="character-personality"></p>
                </article>

                <article class="character-info-card">
                    <h3>Dentro de Limbus Company</h3>
                    <p id="character-role"></p>
                </article>

                <article class="character-info-card">
                    <h3>Inspiración literaria</h3>
                    <p id="character-literary"></p>
                </article>
            </div>
        </section>

        <section class="content-section lore-wrapper" id="lore-wrapper"></section>

        <section class="content-section">
            <div class="section-title">
                <h2>Navegación</h2>
            </div>

            <nav class="character-navigation" id="sinner-navigation" aria-label="Navegación entre Sinners"></nav>

            <div class="all-sinners-navigation" id="all-sinners-navigation" aria-label="Todos los Sinners"></div>
        </section>
    </main>

    <footer class="site-footer">
       <p>Limbus Company — Proyecto final</p>
        <P>Marcos Maddonni, Fausto Venguria, Kevin Flores</P>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
